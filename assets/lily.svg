<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Bunga lily pink">
  <defs>
    <!-- Gradasi kelopak: pucat di pangkal, makin pink ke ujung -->
    <radialGradient id="kelopak" cx="50%" cy="50%" r="62%">
      <stop offset="0%"   stop-color="#fff4f8"/>
      <stop offset="42%"  stop-color="#fbd0e0"/>
      <stop offset="78%"  stop-color="#f2a8c6"/>
      <stop offset="100%" stop-color="#e07fa6"/>
    </radialGradient>

    <!-- Gradasi inti bunga -->
    <radialGradient id="inti" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff8fb"/>
      <stop offset="60%"  stop-color="#fde4ee"/>
      <stop offset="100%" stop-color="#f8c8dc" stop-opacity="0"/>
    </radialGradient>

    <!-- Bentuk satu kelopak (mengarah ke atas) -->
    <path id="bentuk-kelopak"
          d="M100 100
             C 84 74, 80 38, 100 8
             C 120 38, 116 74, 100 100 Z"/>

    <!-- Bayangan halus di bawah bunga -->
    <filter id="lembut" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Bayangan -->
  <ellipse cx="100" cy="196" rx="42" ry="5" fill="#d88aa8" opacity="0.22" filter="url(#lembut)"/>

  <!-- 6 kelopak, diputar 60 derajat -->
  <g>
    <use href="#bentuk-kelopak" transform="rotate(0 100 100)"   fill="url(#kelopak)"/>
    <use href="#bentuk-kelopak" transform="rotate(60 100 100)"  fill="url(#kelopak)"/>
    <use href="#bentuk-kelopak" transform="rotate(120 100 100)" fill="url(#kelopak)"/>
    <use href="#bentuk-kelopak" transform="rotate(180 100 100)" fill="url(#kelopak)"/>
    <use href="#bentuk-kelopak" transform="rotate(240 100 100)" fill="url(#kelopak)"/>
    <use href="#bentuk-kelopak" transform="rotate(300 100 100)" fill="url(#kelopak)"/>
  </g>

  <!-- Urat tiap kelopak -->
  <g stroke="#e88cb0" stroke-width="0.9" opacity="0.5" fill="none">
    <g>
      <path d="M100 92 L100 26"/>
      <path d="M100 92 L100 26" transform="rotate(60 100 100)"/>
      <path d="M100 92 L100 26" transform="rotate(120 100 100)"/>
      <path d="M100 92 L100 26" transform="rotate(180 100 100)"/>
      <path d="M100 92 L100 26" transform="rotate(240 100 100)"/>
      <path d="M100 92 L100 26" transform="rotate(300 100 100)"/>
    </g>
  </g>

  <!-- Titik-titik kecil di kelopak (tekstur lily) -->
  <g fill="#d87ba2" opacity="0.4">
    <circle cx="100" cy="52" r="1.4"/>
    <circle cx="97"  cy="64" r="1.1"/>
    <circle cx="103" cy="66" r="1.1"/>
    <circle cx="100" cy="78" r="1.2"/>
    <circle cx="100" cy="52" r="1.4" transform="rotate(60 100 100)"/>
    <circle cx="97"  cy="64" r="1.1" transform="rotate(60 100 100)"/>
    <circle cx="103" cy="66" r="1.1" transform="rotate(60 100 100)"/>
    <circle cx="100" cy="52" r="1.4" transform="rotate(120 100 100)"/>
    <circle cx="97"  cy="64" r="1.1" transform="rotate(120 100 100)"/>
    <circle cx="103" cy="66" r="1.1" transform="rotate(120 100 100)"/>
    <circle cx="100" cy="52" r="1.4" transform="rotate(180 100 100)"/>
    <circle cx="97"  cy="64" r="1.1" transform="rotate(180 100 100)"/>
    <circle cx="103" cy="66" r="1.1" transform="rotate(180 100 100)"/>
    <circle cx="100" cy="52" r="1.4" transform="rotate(240 100 100)"/>
    <circle cx="97"  cy="64" r="1.1" transform="rotate(240 100 100)"/>
    <circle cx="103" cy="66" r="1.1" transform="rotate(240 100 100)"/>
    <circle cx="100" cy="52" r="1.4" transform="rotate(300 100 100)"/>
    <circle cx="97"  cy="64" r="1.1" transform="rotate(300 100 100)"/>
    <circle cx="103" cy="66" r="1.1" transform="rotate(300 100 100)"/>
  </g>

  <!-- Benang sari -->
  <g stroke="#e0a94a" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M100 100 Q 96 84, 90 74"/>
    <path d="M100 100 Q 104 84, 110 74"/>
    <path d="M100 100 Q 88 92, 78 88"/>
    <path d="M100 100 Q 112 92, 122 88"/>
    <path d="M100 100 Q 94 108, 86 112"/>
    <path d="M100 100 Q 106 108, 114 112"/>
  </g>
  <g fill="#d99a35">
    <ellipse cx="90"  cy="73"  rx="2.6" ry="3.4" transform="rotate(-20 90 73)"/>
    <ellipse cx="110" cy="73"  rx="2.6" ry="3.4" transform="rotate(20 110 73)"/>
    <ellipse cx="77"  cy="87"  rx="3.4" ry="2.4" transform="rotate(-10 77 87)"/>
    <ellipse cx="123" cy="87"  rx="3.4" ry="2.4" transform="rotate(10 123 87)"/>
    <ellipse cx="85"  cy="113" rx="3.2" ry="2.4" transform="rotate(15 85 113)"/>
    <ellipse cx="115" cy="113" rx="3.2" ry="2.4" transform="rotate(-15 115 113)"/>
  </g>

  <!-- Inti bunga -->
  <circle cx="100" cy="100" r="13" fill="url(#inti)"/>
  <circle cx="100" cy="100" r="5"  fill="#fbe0ec"/>
</svg>
