<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Pola latar yang bisa disusun berulang (tileable).
    Dipakai sebagai background-image di <body>, diulang di seluruh halaman.
    Bunga dibuat kecil dan pucat supaya teks tetap mudah dibaca.
  -->
  <defs>
    <radialGradient id="pk" cx="50%" cy="55%" r="60%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#fbd6e4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f3b0cb" stop-opacity="0.85"/>
    </radialGradient>

    <path id="klp" d="M30 30 C 23 19, 21 7, 30 0 C 39 7, 37 19, 30 30 Z"/>

    <g id="lily-kecil">
      <use href="#klp" transform="rotate(0 30 30)"   fill="url(#pk)"/>
      <use href="#klp" transform="rotate(60 30 30)"  fill="url(#pk)"/>
      <use href="#klp" transform="rotate(120 30 30)" fill="url(#pk)"/>
      <use href="#klp" transform="rotate(180 30 30)" fill="url(#pk)"/>
      <use href="#klp" transform="rotate(240 30 30)" fill="url(#pk)"/>
      <use href="#klp" transform="rotate(300 30 30)" fill="url(#pk)"/>
      <circle cx="30" cy="30" r="4.6" fill="#fdeaf2"/>
      <circle cx="30" cy="30" r="1.9" fill="#e8a8c4"/>
    </g>
  </defs>

  <!-- bunga besar di tengah -->
  <g opacity="0.5">
    <use href="#lily-kecil" transform="translate(58 42) scale(1.5)"/>
  </g>

  <!-- bunga kecil di sudut-sudut (pola berulang) -->
  <g opacity="0.34">
    <use href="#lily-kecil" transform="translate(-14 -16) scale(0.72)"/>
    <use href="#lily-kecil" transform="translate(206 -16) scale(0.72)"/>
    <use href="#lily-kecil" transform="translate(-14 210) scale(0.72)"/>
    <use href="#lily-kecil" transform="translate(206 210) scale(0.72)"/>
  </g>

  <!-- kelopak lepas sebagai aksen -->
  <g opacity="0.22" fill="#f5bcd0">
    <path d="M186 68 C 178 62, 176 52, 186 46 C 196 52, 194 62, 186 68 Z"
          transform="rotate(28 186 57)"/>
    <path d="M44 190 C 36 184, 34 174, 44 168 C 54 174, 52 184, 44 190 Z"
          transform="rotate(-34 44 179)"/>
  </g>

  <!-- titik-titik halus -->
  <g fill="#f0a8c4" opacity="0.18">
    <circle cx="150" cy="120" r="2.4"/>
    <circle cx="92"  cy="176" r="2"/>
    <circle cx="200" cy="188" r="1.8"/>
    <circle cx="24"  cy="96"  r="2"/>
    <circle cx="132" cy="222" r="1.8"/>
  </g>
</svg>
