<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Kue ulang tahun">
  <defs>
    <linearGradient id="lapis1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffd9e6"/>
      <stop offset="100%" stop-color="#f5b0c8"/>
    </linearGradient>
    <linearGradient id="lapis2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fbe4ee"/>
      <stop offset="100%" stop-color="#f2bcd4"/>
    </linearGradient>
    <linearGradient id="piring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8e0e6"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0d6de"/>
    </linearGradient>
    <linearGradient id="nyala" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#ffb347"/>
      <stop offset="55%"  stop-color="#ffd76e"/>
      <stop offset="100%" stop-color="#fff6cc"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- piring -->
  <ellipse cx="100" cy="176" rx="82" ry="10" fill="url(#piring)"/>
  <ellipse cx="100" cy="174" rx="82" ry="9" fill="#f0e8ee" opacity="0.6"/>

  <!-- lapisan bawah -->
  <rect x="26" y="128" width="148" height="46" rx="8" fill="url(#lapis1)"/>
  <!-- lapisan tengah -->
  <rect x="40" y="96" width="120" height="36" rx="7" fill="url(#lapis2)"/>
  <!-- lapisan atas -->
  <rect x="56" y="70" width="88" height="30" rx="6" fill="url(#lapis1)"/>

  <!-- lelehan krim -->
  <g fill="#fff6fa" opacity="0.95">
    <path d="M26 132 q 12 12 24 0 q 12 12 24 0 q 12 12 24 0 q 12 12 24 0 q 12 12 24 0 l 0 -6 l -120 0 z"/>
    <path d="M40 100 q 10 10 20 0 q 10 10 20 0 q 10 10 20 0 q 10 10 20 0 q 10 10 20 0 l 0 -6 l -100 0 z"/>
    <path d="M56 74 q 8 9 16 0 q 8 9 16 0 q 8 9 16 0 q 8 9 16 0 l 0 -5 l -64 0 z"/>
  </g>

  <!-- taburan -->
  <g>
    <circle cx="44"  cy="152" r="3"   fill="#f28fb4"/>
    <circle cx="70"  cy="160" r="2.6" fill="#8cc286"/>
    <circle cx="100" cy="150" r="3"   fill="#ffd76e"/>
    <circle cx="130" cy="158" r="2.6" fill="#8fb8f2"/>
    <circle cx="156" cy="150" r="3"   fill="#f28fb4"/>
    <circle cx="60"  cy="112" r="2.4" fill="#ffd76e"/>
    <circle cx="100" cy="118" r="2.6" fill="#f28fb4"/>
    <circle cx="140" cy="110" r="2.4" fill="#8cc286"/>
    <circle cx="76"  cy="86"  r="2.2" fill="#8fb8f2"/>
    <circle cx="124" cy="84"  r="2.2" fill="#ffd76e"/>
  </g>

  <!-- lilin -->
  <g>
    <!-- lilin kiri -->
    <rect x="76" y="40" width="9" height="32" rx="3" fill="#f5b0c8"/>
    <rect x="76" y="46" width="9" height="3" fill="#fff" opacity="0.8"/>
    <rect x="76" y="56" width="9" height="3" fill="#fff" opacity="0.8"/>
    <ellipse cx="80.5" cy="38" rx="4.5" ry="6" fill="url(#nyala)" filter="url(#glow)"/>

    <!-- lilin tengah -->
    <rect x="95.5" y="32" width="9" height="40" rx="3" fill="#f2a8c4"/>
    <rect x="95.5" y="40" width="9" height="3" fill="#fff" opacity="0.8"/>
    <rect x="95.5" y="52" width="9" height="3" fill="#fff" opacity="0.8"/>
    <ellipse cx="100" cy="29" rx="5" ry="7" fill="url(#nyala)" filter="url(#glow)"/>

    <!-- lilin kanan -->
    <rect x="115" y="42" width="9" height="30" rx="3" fill="#f8c8dc"/>
    <rect x="115" y="48" width="9" height="3" fill="#fff" opacity="0.8"/>
    <rect x="115" y="58" width="9" height="3" fill="#fff" opacity="0.8"/>
    <ellipse cx="119.5" cy="40" rx="4.5" ry="6" fill="url(#nyala)" filter="url(#glow)"/>
  </g>

  <!-- sumbu -->
  <g stroke="#8a6a4a" stroke-width="1.4" stroke-linecap="round">
    <path d="M80.5 44 l 0 -5"/>
    <path d="M100 40 l 0 -6"/>
    <path d="M119.5 46 l 0 -5"/>
  </g>
</svg>
