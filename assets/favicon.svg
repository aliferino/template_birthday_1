<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Favicon bunga lily">
  <defs>
    <radialGradient id="fav" cx="50%" cy="55%" r="60%">
      <stop offset="0%"   stop-color="#fff6fa"/>
      <stop offset="50%"  stop-color="#fbd2e2"/>
      <stop offset="100%" stop-color="#ea8fb4"/>
    </radialGradient>
    <path id="fk" d="M32 32 C 25 22, 23 10, 32 3 C 41 10, 39 22, 32 32 Z"/>
  </defs>

  <rect width="64" height="64" rx="14" fill="#fff0f5"/>

  <g>
    <use href="#fk" transform="rotate(0 32 32)"   fill="url(#fav)"/>
    <use href="#fk" transform="rotate(60 32 32)"  fill="url(#fav)"/>
    <use href="#fk" transform="rotate(120 32 32)" fill="url(#fav)"/>
    <use href="#fk" transform="rotate(180 32 32)" fill="url(#fav)"/>
    <use href="#fk" transform="rotate(240 32 32)" fill="url(#fav)"/>
    <use href="#fk" transform="rotate(300 32 32)" fill="url(#fav)"/>
  </g>

  <circle cx="32" cy="32" r="6" fill="#fdeaf2"/>
  <circle cx="32" cy="32" r="2.6" fill="#e8a8c4"/>
</svg>
