<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!--
    Butiran kertas (paper grain).
    Dipakai sebagai lapisan tipis di atas kertas kalender supaya terasa
    seperti kertas asli, bukan warna datar.
    stitchTiles="stitch" membuat polanya bisa disusun berulang tanpa garis.
  -->
  <filter id="butir" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise"
                  baseFrequency="0.82"
                  numOctaves="4"
                  stitchTiles="stitch"
                  result="derau"/>
    <feColorMatrix type="saturate" values="0" in="derau"/>
    <feComponentTransfer>
      <!-- ditekan kontrasnya supaya hanya bintik halus yang tersisa -->
      <feFuncA type="linear" slope="0.5" intercept="0"/>
    </feComponentTransfer>
  </filter>

  <rect width="220" height="220" filter="url(#butir)"/>
</svg>
